
services:
  db:
    image: postgres:16
    container_name: way2skills-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
   
    volumes:
      - way2skills_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: way2skills-backend:v1
    container_name: way2skills-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      WAY2SKILLS_APPS_SCRIPT_WEB_APP_URL: ${WAY2SKILLS_APPS_SCRIPT_WEB_APP_URL:?Set WAY2SKILLS_APPS_SCRIPT_WEB_APP_URL in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENV: ${ENV:-development}
   
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WAY2SKILLS_API_URL: ${NEXT_PUBLIC_WAY2SKILLS_API_URL:-http://localhost:8000}
    image: way2skills-frontend:v1
    container_name: way2skills-frontend

    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  way2skills_postgres_data:
    name: way2skills_postgres_data

networks:
  default:
  dokker_network:
    external: true